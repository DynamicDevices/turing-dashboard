[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turing-dashboard"
version = "0.2.0"
description = "A Linux laptop and infrastructure dashboard for Turing Revision A USB displays"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Alex J Lennon"}]
keywords = ["turing", "turmo", "usb", "dashboard", "proxmox", "monitoring"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = ["Pillow>=10.1", "psutil>=5.9", "pyserial>=3.5"]

[project.scripts]
turing-dashboard = "turing_dashboard.dashboard:cli"

[tool.setuptools.packages.find]
where = ["src"]
